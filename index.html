<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Generador SCORM — VF Matemáticas</title>

    <!-- MathJax -->
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <link rel="stylesheet" href="generator.css">
    <script defer src="generator.js"></script>

</head>
<body>

<div class="wrapper">

    <h1>Generador SCORM — Verdadero / Falso</h1>
    <p class="subtitle">
        Elige texto o LaTeX y construye la pregunta de manera continua.
    </p>

    <!-- CONFIGURACIÓN -->
    <div class="config-card">
        <h2>Configuración</h2>

        <label>Título</label>
        <input id="tituloActividad">

        <label>Identificador SCORM</label>
        <input id="identificadorScorm">

        <label>Puntos por defecto</label>
        <input id="puntosDefecto" type="number" value="1">

        <label>Penalización por reintento (%)</label>
        <input id="penalizacion" type="number" value="0">
    </div>

    <div id="preguntasContainer"></div>

    <div class="btn-row">
        <button class="btn" id="btnAgregarPregunta">+ Agregar pregunta</button>
        <button class="btn" id="btnGenerar">Generar archivos</button>
    </div>

    <div id="salida"></div>

</div>

</body>
</html>
